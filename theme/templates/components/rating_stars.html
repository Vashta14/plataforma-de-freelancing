<div class="flex items-center gap-1" aria-label="Nota {{ nota }} de 5">
  <span class="{% if nota >= 1 %}text-amber-400{% else %}text-slate-200{% endif %}">★</span>
  <span class="{% if nota >= 2 %}text-amber-400{% else %}text-slate-200{% endif %}">★</span>
  <span class="{% if nota >= 3 %}text-amber-400{% else %}text-slate-200{% endif %}">★</span>
  <span class="{% if nota >= 4 %}text-amber-400{% else %}text-slate-200{% endif %}">★</span>
  <span class="{% if nota >= 5 %}text-amber-400{% else %}text-slate-200{% endif %}">★</span>
  {% if show_value %}<span class="ml-2 text-sm font-semibold text-slate-500">{{ nota }}/5</span>{% endif %}
</div>
