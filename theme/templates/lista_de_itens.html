{% extends 'base.html' %}
{% block title %}Lista de Itens — FreelaHub{% endblock %}
{% block content %}
<div class="mx-auto max-w-7xl px-6 py-16 lg:px-8">
  <h1 class="text-3xl font-bold tracking-tight text-purple-900">{{ titulo }}</h1>
  <ul class="mt-8 space-y-3">
    {% for item in itens %}
      <li class="rounded-xl border border-purple-200 bg-white p-4 text-purple-900"><strong>{{ item.name }}</strong> - {{ item.description }}</li>
    {% empty %}
      {% include "components/estado_vazio.html" %}
    {% endfor %}
  </ul>
</div>
{% endblock %}
