{% load static tailwind_tags %}
<!doctype html>
<html lang="pt-BR">
  <head>
    {% tailwind_css %}
    <title>{{ titulo }}</title>
  </head>
  <body>
    <h1 class="font-bold text-2xl text-gray-600">{{ titulo }}</h1>
    <ul>
      {% for item in itens %}
      <li><strong>{{ item.name }}</strong> - {{ item.description }}</li>
      {% empty %} {% include "components/estado_vazio.html" %} {% endfor %}
    </ul>
  </body>
</html>
